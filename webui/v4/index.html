<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NetOps Autopilot — Chat Operator</title>
  <style>
    /* ---------------------------------------------------------- design system */
    :root {
      --bg: #0b1020;
      --bg-soft: #131a2e;
      --bg-card: #1a2240;
      --bg-input: #0e1530;
      --border: #2a3358;
      --border-soft: #1f274a;
      --text: #e6ecff;
      --text-dim: #8a93b8;
      --text-faint: #5a6488;
      --accent: #5b9dff;
      --accent-soft: #3a5fa0;
      --ok: #4ade80;
      --warn: #fbbf24;
      --err: #f87171;
      --blocked: #c084fc;
      --needs: #fb923c;
      --info: #60a5fa;
      --radius: 10px;
      --radius-lg: 14px;
      --shadow: 0 4px 24px rgba(0,0,0,0.35);
      --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace;
    }
    /* Arabic layout */
    [dir="rtl"] { text-align: right; }
    [dir="rtl"] .msgs { direction: rtl; }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro",
            "Noto Sans Arabic", "Cairo", "Tajawal", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 20% -10%, #1a2456 0%, transparent 60%),
        radial-gradient(900px 500px at 100% 110%, #2a1a4a 0%, transparent 60%),
        var(--bg);
      min-height: 100vh;
      overflow: hidden;
    }
    code, pre, .mono { font-family: var(--mono); }

    /* ---------------------------------------------------------- layout */
    .app {
      display: grid;
      grid-template-rows: 60px 1fr;
      grid-template-columns: 280px 1fr 340px;
      grid-template-areas:
        "topbar topbar topbar"
        "sidebar chat  timeline";
      height: 100vh;
      width: 100vw;
    }
    .topbar {
      grid-area: topbar;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 18px;
      background: rgba(15,21,46,0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-soft);
    }
    .topbar .logo {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.5px;
    }
    .topbar .logo .dot {
      display: inline-block;
      width: 10px; height: 10px;
      background: var(--ok);
      border-radius: 50%;
      margin-right: 8px;
      box-shadow: 0 0 8px var(--ok);
    }
    .topbar .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .topbar .pill.ok { color: var(--ok); border-color: #1f4a30; }
    .topbar .spacer { flex: 1; }
    .topbar .actions button {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .topbar .actions button:hover { background: var(--accent-soft); }

    /* ---------------------------------------------------------- sidebar */
    .sidebar {
      grid-area: sidebar;
      background: rgba(15,21,46,0.6);
      border-right: 1px solid var(--border-soft);
      padding: 14px;
      overflow-y: auto;
    }
    .sidebar h3 {
      margin: 0 0 10px 0;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-faint);
    }
    .suggested {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .suggested button {
      text-align: left;
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border-soft);
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.12s, transform 0.06s;
    }
    [dir="rtl"] .suggested button { text-align: right; }
    .suggested button:hover { background: var(--accent-soft); border-color: var(--accent); }
    .suggested button:active { transform: scale(0.98); }
    .suggested button .ico { margin-right: 8px; opacity: 0.8; }
    [dir="rtl"] .suggested button .ico { margin-right: 0; margin-left: 8px; }

    .inv {
      margin-top: 18px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 10px;
    }
    .inv .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px dashed var(--border-soft);
      font-size: 12px;
    }
    .inv .row:last-child { border-bottom: none; }
    .inv .row .name { color: var(--text); font-weight: 500; }
    .inv .row .role { color: var(--text-faint); font-size: 10px; text-transform: uppercase; }

    /* ---------------------------------------------------------- chat */
    .chat {
      grid-area: chat;
      display: grid;
      grid-template-rows: 1fr auto;
      background: rgba(11,16,32,0.4);
    }
    .msgs {
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      animation: msgIn 0.18s ease-out;
      position: relative;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #2a4480, #1f2f5e);
      border: 1px solid #3a5fa0;
      border-bottom-right-radius: 4px;
    }
    [dir="rtl"] .msg.user { align-self: flex-start; border-bottom-right-radius: var(--radius-lg); border-bottom-left-radius: 4px; }
    .msg.bot {
      align-self: flex-start;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    [dir="rtl"] .msg.bot { align-self: flex-end; border-bottom-left-radius: var(--radius-lg); border-bottom-right-radius: 4px; }
    .msg .head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 11px;
      color: var(--text-faint);
    }
    .msg .head .badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .badge.status-OK       { background: #1f4a30; color: #a3f0c1; }
    .badge.status-NEEDS_INPUT { background: #4a3a1f; color: #fcd9a3; }
    .badge.status-BLOCKED  { background: #4a1f3a; color: #f0a3d9; }
    .badge.status-INFO     { background: #1f3a4a; color: #a3d9f0; }
    .badge.status-FAILURE  { background: #4a1f1f; color: #f0a3a3; }
    .msg .summary { font-weight: 600; margin-bottom: 4px; }
    .msg .detail {
      font-size: 12.5px;
      color: var(--text-dim);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg .detail code {
      background: rgba(255,255,255,0.06);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 12px;
    }
    .msg .actions {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .msg .actions button {
      background: rgba(91,157,255,0.12);
      color: var(--accent);
      border: 1px solid rgba(91,157,255,0.3);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11.5px;
    }
    .msg .actions button:hover {
      background: rgba(91,157,255,0.25);
    }
    .typing {
      align-self: flex-start;
      padding: 10px 16px;
      color: var(--text-faint);
      font-style: italic;
      font-size: 12px;
    }
    .typing::after {
      content: '...';
      animation: dots 1.4s infinite;
    }
    @keyframes dots {
      0%, 20%  { content: '.'; }
      40%      { content: '..'; }
      60%, 100%{ content: '...'; }
    }
    .composer {
      display: flex;
      gap: 8px;
      padding: 14px 20px;
      background: rgba(15,21,46,0.85);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border-soft);
    }
    .composer input {
      flex: 1;
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }
    .composer input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(91,157,255,0.2); }
    .composer input::placeholder { color: var(--text-faint); }
    .composer button.send {
      background: linear-gradient(135deg, var(--accent), #4a7fc8);
      color: white;
      border: none;
      padding: 0 22px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    .composer button.send:hover { filter: brightness(1.15); }
    .composer button.send:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ---------------------------------------------------------- timeline */
    .timeline {
      grid-area: timeline;
      background: rgba(15,21,46,0.6);
      border-left: 1px solid var(--border-soft);
      padding: 14px;
      overflow-y: auto;
    }
    .timeline h3 {
      margin: 0 0 10px 0;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-faint);
    }
    .tl-item {
      display: flex;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border-soft);
      font-size: 12px;
    }
    .tl-item:last-child { border-bottom: none; }
    .tl-item .when { color: var(--text-faint); font-family: var(--mono); font-size: 10px; flex-shrink: 0; }
    .tl-item .what { color: var(--text); }
    .tl-item .what .verb { color: var(--accent); font-weight: 600; }
    .tl-item .what .outcome { color: var(--text-dim); }

    /* ---------------------------------------------------------- empty / welcome */
    .welcome {
      max-width: 640px;
      margin: 60px auto;
      text-align: center;
    }
    .welcome h1 {
      font-size: 28px;
      margin: 0 0 8px 0;
      background: linear-gradient(90deg, #5b9dff, #c084fc);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .welcome p { color: var(--text-dim); margin: 0 0 24px 0; font-size: 15px; }
    .welcome .prompts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }
    .welcome .prompts button {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border-soft);
      padding: 14px;
      border-radius: var(--radius);
      cursor: pointer;
      text-align: left;
      font: inherit;
    }
    [dir="rtl"] .welcome .prompts button { text-align: right; }
    .welcome .prompts button:hover { border-color: var(--accent); background: var(--bg-soft); }
    .welcome .prompts button .title { display: block; font-weight: 600; margin-bottom: 2px; }
    .welcome .prompts button .desc { display: block; color: var(--text-faint); font-size: 12px; }

    /* ---------------------------------------------------------- responsive */
    @media (max-width: 1024px) {
      .app { grid-template-columns: 1fr; grid-template-areas: "topbar" "chat"; }
      .sidebar, .timeline { display: none; }
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-soft); }
  </style>
</head>
<body>
  <div class="app" id="app">
    <!-- ============================== TOPBAR ============================== -->
    <header class="topbar">
      <div class="logo"><span class="dot"></span>NetOps Autopilot</div>
      <span class="pill" id="bond-pill">⚠ unbonded</span>
      <span class="pill" id="devices-pill">0 devices</span>
      <span class="pill" id="ledger-pill">0 events</span>
      <div class="spacer"></div>
      <div class="actions">
        <button id="lang-btn" title="Toggle language">AR / EN</button>
        <button id="help-btn" title="Show help">?</button>
      </div>
    </header>

    <!-- ============================== SIDEBAR ============================== -->
    <aside class="sidebar">
      <h3 id="side-suggestions">Suggested</h3>
      <div class="suggested" id="suggested"></div>
      <div class="inv" id="inv">
        <h3 id="side-inventory">Inventory</h3>
        <div id="inv-rows" style="color: var(--text-faint); font-size:12px;">
          —
        </div>
      </div>
    </aside>

    <!-- ============================== CHAT ============================== -->
    <section class="chat">
      <div class="msgs" id="msgs">
        <div class="welcome" id="welcome">
          <h1 id="welcome-h">Ask the network operator.</h1>
          <p id="welcome-p">
            Type anything in English or Arabic. Discover devices, design a
            topology, apply a configuration — all in natural language.
          </p>
          <div class="prompts" id="prompts"></div>
        </div>
      </div>
      <div class="composer">
        <input id="input" autocomplete="off"
               placeholder="Try: 'discover' or 'show devices' or 'apply hotel'…"
               aria-label="message" />
        <button class="send" id="send">Send</button>
      </div>
    </section>

    <!-- ============================== TIMELINE ============================== -->
    <aside class="timeline">
      <h3 id="tl-title">Activity</h3>
      <div id="tl"></div>
    </aside>
  </div>

  <script>
  /* ============================================================= state */
  const S = {
    lang: localStorage.getItem("chat.lang") || "en",
    bonded: false,
    devices: [],
    links: 0,
    ledger: 0,
    messages: [],     // history for context
  };

  const T = {
    en: {
      bondYes: "✓ bonded",
      bondNo:  "⚠ unbonded",
      inv:     "Inventory",
      sug:     "Suggested",
      act:     "Activity",
      send:    "Send",
      placeholder: "Try: 'discover' or 'show devices' or 'apply hotel'…",
      welcomeH: "Ask the network operator.",
      welcomeP: "Type anything in English or Arabic. Discover devices, design a topology, apply a configuration — all in natural language.",
      prompts: [
        {title:"Discover the network", desc:"Walk the network and find devices",
         msg:"discover"},
        {title:"Show devices", desc:"List everything we found",
         msg:"show devices"},
        {title:"Show topology", desc:"See the network map",
         msg:"show topology"},
        {title:"Design a branch", desc:"Build a branch-office design",
         msg:"design branch"},
        {title:"Apply a hotel", desc:"Design + push config to devices",
         msg:"apply hotel"},
        {title:"Verify", desc:"Audit the ledger chain",
         msg:"verify"},
      ],
      suggestions: [
        {ico:"🔍", t:"discover",  msg:"discover"},
        {ico:"📋", t:"show devices", msg:"show devices"},
        {ico:"🗺",  t:"show topology", msg:"show topology"},
        {ico:"📡", t:"show interfaces", msg:"show interfaces"},
        {ico:"⚙",  t:"design branch", msg:"design branch"},
        {ico:"🚀", t:"apply branch", msg:"apply branch"},
        {ico:"🔄", t:"status", msg:"status"},
      ],
    },
    ar: {
      bondYes: "✓ مربوط",
      bondNo:  "⚠ غير مربوط",
      inv:     "الأجهزة",
      sug:     "مقترحات",
      act:     "النشاط",
      send:    "إرسال",
      placeholder: "جرّب: 'اكتشف' أو 'اعرض الأجهزة' أو 'طبق فندق'…",
      welcomeH: "اسأل مهندس الشبكة.",
      welcomeP: "اكتب أي شيء بالعربية أو الإنجليزية. اكتشِف الأجهزة، صمّم طوبولوجيا، طبّق الإعدادات — كل ذلك بلغة طبيعية.",
      prompts: [
        {title:"اكتشف الشبكة", desc:"امسح الشبكة وابحث عن الأجهزة",
         msg:"اكتشف"},
        {title:"اعرض الأجهزة", desc:"قائمة بكل ما وجدناه",
         msg:"اعرض الأجهزة"},
        {title:"الخريطة", desc:"شاهد خريطة الشبكة",
         msg:"اعرض الخريطة"},
        {title:"صمم فرع", desc:"صمم شبكة مكتب فرعي",
         msg:"صمم فرع"},
        {title:"طبّق فندق", desc:"صمّم وادفع الإعدادات للأجهزة",
         msg:"طبق فندق"},
        {title:"تحقق", desc:"تدقيق سلسلة السجلات",
         msg:"تحقق"},
      ],
      suggestions: [
        {ico:"🔍", t:"اكتشف",  msg:"اكتشف"},
        {ico:"📋", t:"اعرض الأجهزة", msg:"اعرض الأجهزة"},
        {ico:"🗺",  t:"اعرض الخريطة", msg:"اعرض الخريطة"},
        {ico:"📡", t:"اعرض المنافذ", msg:"اعرض المنافذ"},
        {ico:"⚙",  t:"صمم فرع", msg:"صمم فرع"},
        {ico:"🚀", t:"طبق فرع", msg:"طبق فرع"},
        {ico:"🔄", t:"الحالة", msg:"الحالة"},
      ],
    }
  };

  /* ============================================================= helpers */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s ?? "").replace(/[&<>"]/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function now() {
    const d = new Date();
    return d.toTimeString().slice(0,8);
  }
  function isRTL(msg) { return /[\u0600-\u06FF]/.test(msg); }

  /* ============================================================= i18n */
  function applyLang() {
    const t = T[S.lang];
    document.documentElement.lang = S.lang;
    document.documentElement.dir = S.lang === "ar" ? "rtl" : "ltr";
    $("bond-pill").textContent = S.bonded ? t.bondYes : t.bondNo;
    $("side-suggestions").textContent = t.sug;
    $("side-inventory").textContent = t.inv;
    $("tl-title").textContent = t.act;
    $("send").textContent = t.send;
    $("input").placeholder = t.placeholder;
    $("welcome-h").textContent = t.welcomeH;
    $("welcome-p").textContent = t.welcomeP;
    renderSuggestions();
    renderPrompts();
    localStorage.setItem("chat.lang", S.lang);
  }

  /* ============================================================= rendering */
  function renderSuggestions() {
    const t = T[S.lang];
    $("suggested").innerHTML = t.suggestions.map(s =>
      `<button data-msg="${esc(s.msg)}"><span class="ico">${s.ico}</span>${esc(s.t)}</button>`
    ).join("");
    $("suggested").querySelectorAll("button").forEach(b =>
      b.addEventListener("click", () => send(b.dataset.msg)));
  }
  function renderPrompts() {
    const t = T[S.lang];
    $("prompts").innerHTML = t.prompts.map(p =>
      `<button data-msg="${esc(p.msg)}">
         <span class="title">${esc(p.title)}</span>
         <span class="desc">${esc(p.desc)}</span>
       </button>`
    ).join("");
    $("prompts").querySelectorAll("button").forEach(b =>
      b.addEventListener("click", () => send(b.dataset.msg)));
  }

  function renderInv() {
    const rows = $("inv-rows");
    if (!S.devices.length) {
      rows.innerHTML = `<span style="color:var(--text-faint)">—</span>`;
      return;
    }
    rows.innerHTML = S.devices.map(d => `
      <div class="row">
        <span class="name">${esc(d.device_ref)}</span>
        <span class="role">${esc(d.classification || d.role || "")}</span>
      </div>
    `).join("");
  }

  function renderStatus() {
    $("bond-pill").textContent = S.bonded
      ? T[S.lang].bondYes : T[S.lang].bondNo;
    $("bond-pill").classList.toggle("ok", S.bonded);
    $("devices-pill").textContent =
      `${S.devices.length} ${S.lang === "ar" ? "جهاز" : "devices"}`;
    $("ledger-pill").textContent = `${S.ledger} ${S.lang === "ar" ? "حدث" : "events"}`;
  }

  function addTimeline(verb, outcome) {
    const tl = $("tl");
    const item = document.createElement("div");
    item.className = "tl-item";
    item.innerHTML = `
      <span class="when">${now()}</span>
      <span class="what"><span class="verb">${esc(verb)}</span>
        <span class="outcome">${esc(outcome || "")}</span>
      </span>`;
    tl.prepend(item);
  }

  function addMessage(role, reply) {
    const welcome = $("welcome");
    if (welcome) welcome.remove();
    const msgs = $("msgs");
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    let actions = "";
    if (reply && reply.actions && reply.actions.length) {
      actions = `<div class="actions">${reply.actions.map(a =>
        `<button data-msg="${esc(a.label)}">${esc(a.label)}</button>`
      ).join("")}</div>`;
      div.querySelectorAll && null;  // event bound later
    }
    if (role === "bot" && reply) {
      const head = `
        <div class="head">
          <span class="badge status-${esc(reply.status)}">${esc(reply.status)}</span>
          <span>· ${esc(reply.intent)}</span>
        </div>`;
      const detail = reply.detail
        ? `<div class="detail mono">${esc(reply.detail)}</div>` : "";
      const summary = reply.summary
        ? `<div class="summary">${esc(reply.summary)}</div>` : "";
      div.innerHTML = head + summary + detail + actions;
    } else if (role === "user") {
      const raw = typeof reply === "string" ? reply : reply.text;
      div.innerHTML = `<div class="detail">${esc(raw)}</div>`;
    } else {
      div.innerHTML = `<div class="detail">${esc(reply.text || "")}</div>`;
    }
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    // Bind action buttons
    div.querySelectorAll(".actions button").forEach(b =>
      b.addEventListener("click", () => send(b.dataset.msg)));
    return div;
  }

  function showTyping() {
    const t = document.createElement("div");
    t.className = "typing";
    t.id = "typing";
    t.textContent = S.lang === "ar" ? "يفكّر" : "thinking";
    $("msgs").appendChild(t);
    $("msgs").scrollTop = $("msgs").scrollHeight;
  }
  function hideTyping() {
    const t = $("typing");
    if (t) t.remove();
  }

  /* ============================================================= network */
  async function callChat(text) {
    const r = await fetch("/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, lang: S.lang}),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  }

  async function refreshState() {
    try {
      const r = await fetch("/state");
      if (!r.ok) return;
      const st = await r.json();
      S.bonded = !!st.bonded;
      S.devices = st.devices || [];
      S.links = st.links || 0;
      S.ledger = st.ledger || 0;
      renderStatus();
      renderInv();
    } catch (e) { /* ignore */ }
  }

  /* ============================================================= main loop */
  async function send(text) {
    text = (text || $("input").value || "").trim();
    if (!text) return;
    $("input").value = "";
    $("send").disabled = true;
    addMessage("user", text);
    S.messages.push({role:"user", text});
    showTyping();
    try {
      const reply = await callChat(text);
      hideTyping();
      addMessage("bot", reply);
      addTimeline(reply.intent, reply.status);
      S.messages.push({role:"bot", reply});
      await refreshState();
    } catch (e) {
      hideTyping();
      addMessage("bot", {
        status: "FAILURE",
        intent: "ERROR",
        summary: "Network error",
        detail: String(e),
      });
    } finally {
      $("send").disabled = false;
      $("input").focus();
    }
  }

  /* ============================================================= wire-up */
  $("send").addEventListener("click", () => send());
  $("input").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  $("lang-btn").addEventListener("click", () => {
    S.lang = S.lang === "en" ? "ar" : "en";
    applyLang();
  });
  $("help-btn").addEventListener("click", () => send("help"));

  applyLang();
  refreshState();
  </script>
</body>
</html>
